repos:
  # 1. General Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
      - id: check-merge-conflict

  # 2. Ruff (Linting & Formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # 3. Ty (Type Checking)
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

  # 4. Security
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # 5. Security Vulnerabilities
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # 6. Spell Checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell

  # 7. Commit Message Linting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.2
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [post-commit]

  # 8. Documentation Coverage
  - repo: local
    hooks:
      - id: interrogate
        name: interrogate
        entry: uv run interrogate src/verger
        language: system
        types: [python]
        pass_filenames: false

  # 9. API Reference & Docs Integrity
  - repo: local
    hooks:
      - id: mkdocs-build
        name: mkdocs-build
        entry: uv run mkdocs build --strict
        language: system
        always_run: true
        pass_filenames: false

  # 10. Dead Code Detection
  - repo: local
    hooks:
      - id: vulture
        name: vulture
        entry: uv run vulture src/verger
        language: system
        types: [python]
        pass_filenames: false

  # 11. Dependency Validation
  - repo: local
    hooks:
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        types: [python]
        pass_filenames: false

  # 12. Modernization Suggestions
  - repo: local
    hooks:
      - id: refurb
        name: refurb
        entry: bash -c "export MYPYPATH=src && uv run refurb src/verger --python-version 3.12"
        language: system
        types: [python]
        pass_filenames: false

  # 13. Test Suite (Runs on every commit)
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
