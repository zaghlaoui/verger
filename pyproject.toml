[project]
name = "verger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ZAGHLAOUI Karim", email = "k.zaghlaoui.pro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "textual>=8.2.6",
    "typer>=0.25.1",
]

[project.scripts]
verger = "verger.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pre-commit>=4.6.0",
    "ty>=0.0.36",
    "detect-secrets>=1.5.0",
    "codespell>=2.4.2",
    "commitizen>=4.16.2",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[tool.ty]
environment.python-version = "3.12"
rules.all = "warn"
rules.unresolved-import = "error"
