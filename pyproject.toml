[project]
name = "verger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ZAGHLAOUI Karim", email = "k.zaghlaoui.pro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "textual>=8.2.6",
    "typer>=0.25.1",
]

[project.scripts]
verger = "verger.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pre-commit>=4.6.0",
    "ty>=0.0.36",
    "detect-secrets>=1.5.0",
    "codespell>=2.4.2",
    "commitizen>=4.16.2",
    "bandit>=1.9.4",
    "mkdocs-include-markdown-plugin>=7.3.0",
    "pytest-cov>=7.1.0",
    "interrogate>=1.7.0",
    "vulture>=2.16",
    "deptry>=0.25.1",
    "mkdocstrings[python]>=1.0.4",
    "refurb>=2.3.1",
    "pytest-picked>=0.5.1",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[tool.ty]
environment.python-version = "3.12"
rules.all = "warn"
rules.unresolved-import = "error"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (Security)
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/verger/core/lab/git_driver.py" = ["S603", "S607"]

[tool.bandit]
exclude_dirs = ["tests"]
# B404: subprocess import, B603: subprocess.run without shell=True
# These are audited and hardened in git_service.py
skips = ["B404", "B603"]

[tool.pytest.ini_options]
addopts = "--cov=src/verger --cov-report=term-missing --cov-fail-under=47"
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
fail-under = 100
exclude = ["setup.py", "docs", "build", "tests"]
ignore-regex = ["^__.*__$"]
verbose = 0
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false

[tool.vulture]
exclude = ["tests"]
ignore_decorators = ["@app.command", "@app.callback"]
ignore_names = [
    "main", "args", "kwargs",
    "compose", "on_mount", "on_button_pressed", "on_select_changed", "on_text_area_changed",
    "TITLE", "CSS", "BINDINGS", "action_*",
    "info", "list_prompts", "tui",
    "get_id", "get_variables"
]
min_confidence = 80

[tool.deptry]
exclude = ["tests", "docs", ".venv"]
known_first_party = ["verger"]
