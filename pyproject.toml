[project]
name = "verger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ZAGHLAOUI Karim", email = "k.zaghlaoui.pro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "textual>=8.2.6",
    "typer>=0.25.1",
]

[project.scripts]
verger = "verger.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]


