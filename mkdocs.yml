site_name: Verger
site_url: https://zaghlaoui.github.io/verger/
repo_url: https://github.com/zaghlaoui/verger
theme:
  name: material
  favicon: assets/favicon.svg
  icon:
    logo: material/forest
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode (Default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true

extra:
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji

nav:
  - Home:
      - Verger: index.md
      - Quickstart: quickstart.md
  - User Guide:
      - Configuration: guide/config.md
      - CLI Usage: guide/cli.md
  - API Reference:
      - Core Engine: reference/core.md
      - Models & Adapters: reference/models.md
      - Prompts & Adapters: reference/prompts.md
      - Utilities & CLI: reference/utils.md
  - Architecture:
      - Overview: architecture/overview.md
  - Contributing: contributing.md
